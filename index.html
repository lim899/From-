<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>个人主页</title>
<meta name="description" content="个人主页 —— 简介与作品。">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)">

<!-- 旧的快捷添加入口兼容：金句收藏夹以前住在根目录，存下来的书签小工具和 iOS
     快捷指令指向的是 /?text=…。这段要在渲染之前跑，把它们转交给 /quotes/。 -->
<script>
(function () {
  var s = location.search;
  if (/[?&](text|q|quote)=/.test(s)) location.replace('./quotes/' + s + location.hash);
})();
</script>

<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316150f'/%3E%3Cpath d='M8 9h16M8 16h16M8 23h10' stroke='%23e8b04b' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">

<!-- 显示字体。不想要外部依赖的话，删掉下面这两行就行 ——
     site.css 里的字体栈会自动退回到系统衬线字体，排版依然成立。 -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">

<link rel="stylesheet" href="./assets/site.css">
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="masthead">
  <div class="wrap masthead-row">
    <a class="masthead-brand" href="#top"><span data-bind="name">&nbsp;</span></a>
    <nav class="masthead-nav" aria-label="主导航">
      <a href="#work">作品</a>
      <a href="./quotes/">金句收藏夹</a>
      <a data-bind="github" href="https://github.com/lim899" rel="noreferrer noopener">GitHub</a>
    </nav>
  </div>
</header>

<main id="top">

  <!-- ================= 首屏 ================= -->
  <section class="hero" aria-labelledby="hero-name">
    <div class="wrap">

      <p class="kicker" data-parallax="6">
        <span data-bind="issue">ISSUE 01</span>
        <span class="kicker-dot">·</span>
        <span data-bind="year">2026</span>
        <span class="kicker-dot">·</span>
        <span>自 出 版</span>
      </p>

      <hr class="rule rule-thick">

      <div class="hero-grid">
        <div class="hero-text">
          <h1 class="display" id="hero-name" data-parallax="10">&nbsp;</h1>
          <p class="tagline" id="hero-tagline" data-parallax="6">&nbsp;</p>
          <hr class="rule rule-gold">
          <dl class="meta" id="hero-meta"></dl>
          <p class="hero-links" id="hero-links"></p>
        </div>

        <figure class="portrait" data-parallax="-8">
          <div class="portrait-frame">
            <img id="avatar" alt="头像" width="360" height="360" decoding="async">
          </div>
          <figcaption><span data-bind="handle">@lim899</span></figcaption>
        </figure>
      </div>

    </div>
  </section>

  <!-- ================= 作品 ================= -->
  <section class="work reveal" id="work" aria-labelledby="work-head">
    <div class="wrap">
      <h2 class="section-head" id="work-head"><span>Selected Work</span></h2>
      <div class="cards" id="cards"></div>
      <p class="work-note" id="work-note"></p>
    </div>
  </section>

</main>

<footer class="foot reveal">
  <div class="wrap foot-row">
    <p class="foot-links" id="foot-links"></p>
    <p class="foot-legal">&copy; <span data-bind="year">2026</span> <span data-bind="name">&nbsp;</span></p>
  </div>
</footer>

<script src="./assets/profile.js"></script>
<script src="./assets/site.js"></script>
</body>
</html>
